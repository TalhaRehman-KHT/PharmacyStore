name: Pharmacy Store CI/CD

on:
  push:
    branches: [v4-fix]
  pull_request:
    branches: [v4-fix]

concurrency:
  group: pharmacy-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 833167447372.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPO: pharmacystore
  ECS_CLUSTER: pharmacy-store-cluster
  CLIENT_SERVICE: pharmacy-store-client-service
  SERVER_SERVICE: pharmacy-store-server-service-u9mf7m09

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Client .env
        run: |
          cat <<EOF > Client/.env
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID=${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_MEDASSIST_API_URL=${{ vars.VITE_MEDASSIST_API_URL }}
          VITE_MEDASSIST_USE_MOCK=false
          EOF

      - name: Create Server .env
        run: |
          cat <<EOF > Server/.env
          PORT=${{ secrets.PORT }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          STRIPE_CURRENCY=${{ secrets.STRIPE_CURRENCY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          EOF

      - name: Build Client Docker Image
        run: |
          docker build \
            --secret id=env,src=Client/.env \
            -t pharmacy-store-client \
            ./Client

      - name: Build Server Docker Image
        run: |
          docker build \
            -t pharmacy-store-server \
            ./Server

      # ---- Yahan se neeche sirf push event pe (PR pe nahi) ----
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push images to ECR
        if: github.event_name == 'push'
        run: |
          # ECS yehi tags use karta hai: client aur server
          docker tag pharmacy-store-client $ECR_REGISTRY/$ECR_REPO:client
          docker tag pharmacy-store-server $ECR_REGISTRY/$ECR_REPO:server
          docker push $ECR_REGISTRY/$ECR_REPO:client
          docker push $ECR_REGISTRY/$ECR_REPO:server

          # Rollback ke liye commit SHA wale tags bhi
          docker tag pharmacy-store-client $ECR_REGISTRY/$ECR_REPO:client-${{ github.sha }}
          docker tag pharmacy-store-server $ECR_REGISTRY/$ECR_REPO:server-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPO:client-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPO:server-${{ github.sha }}

  deploy:
    name: Deploy to AWS ECS
    needs: build
    if: github.event_name == 'push'      # PR pe approval nahi maangega
    runs-on: ubuntu-latest

    environment:
      name: production                   # yahan tumhari manual approval aayegi

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Tell ECS to pull the new images
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $CLIENT_SERVICE \
            --force-new-deployment > /dev/null

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $SERVER_SERVICE \
            --force-new-deployment > /dev/null

      - name: Wait until services are stable
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $CLIENT_SERVICE $SERVER_SERVICE