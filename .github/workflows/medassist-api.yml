name: MedAssist API CI/CD

# Only medassist-api changes (and this file) start this workflow; the shop workflow (ci-cd.yml) is separate.
on:
  push:
    branches: [v4-fix]
    paths:
      - "medassist-api/**"
      - ".github/workflows/medassist-api.yml"
  pull_request:
    branches: [v4-fix]
    paths:
      - "medassist-api/**"
      - ".github/workflows/medassist-api.yml"

# Least privilege: read the repo, nothing else.
permissions:
  contents: read

# A newer push to the same PR cancels the old run; runs on the deploy branch are never cancelled.
concurrency:
  group: medassist-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: medassist-api
  ECS_CLUSTER: pharmacy-store-cluster
  ECS_SERVICE: medassist-api-service
  CONTAINER_NAME: medassist-api
  TASK_DEF_FILE: medassist-api/deploy/task-definition.json

jobs:
  test:
    name: Lint (ruff) and compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medassist-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No test suite on purpose (PR-02); live checks need the real Supabase and run locally.
      - name: Ruff lint + format check
        run: |
          pip install ruff==0.17.0
          ruff check .
          ruff format --check .

      - name: Byte-compile app/ and scripts/ (catches syntax errors)
        run: python -m compileall -q app scripts

  build:
    name: Build image (push only on the deploy branch)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        run: |
          registry="${{ steps.ecr.outputs.registry }}"
          # On a PR there is no login, so a local name is enough (the image is not pushed).
          repo="${registry:+$registry/}$ECR_REPO"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The build gets NO secrets and writes NO .env: runtime secrets come from SSM when the task starts.
      - name: Build (and push on the deploy branch)
        uses: docker/build-push-action@v6
        with:
          context: medassist-api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha,scope=medassist-api
          cache-to: type=gha,mode=max,scope=medassist-api
          provenance: false

  deploy:
    name: Deploy to ECS (manual approval)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/v4-fix'
    runs-on: ubuntu-latest
    environment:
      name: production
    # Two MedAssist deploys never run at the same time.
    concurrency:
      group: medassist-api-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # GitHub Secret -> SSM SecureString. An empty/missing secret is skipped, so values set by hand in SSM stay.
      # Values travel only through env variables; nothing is echoed (GitHub also masks secrets in logs).
      - name: Sync runtime secrets to SSM
        env:
          SUPABASE_URL: ${{ secrets.MEDASSIST_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.MEDASSIST_SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.MEDASSIST_GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.MEDASSIST_GEMINI_API_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY GROQ_API_KEY GEMINI_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "skip $name (no GitHub secret, SSM value kept)"
              continue
            fi
            aws ssm put-parameter --name "/medassist/prod/$name" --type SecureString \
              --value "$value" --overwrite > /dev/null
            echo "synced $name"
          done

      # Fill the placeholders (account, region, role ARNs from GitHub Variables) and the CORS list.
      - name: Fill task definition placeholders
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          MEDASSIST_EXEC_ROLE_ARN: ${{ vars.MEDASSIST_EXEC_ROLE_ARN }}
          MEDASSIST_TASK_ROLE_ARN: ${{ vars.MEDASSIST_TASK_ROLE_ARN }}
          MEDASSIST_CORS_ORIGINS: ${{ vars.MEDASSIST_CORS_ORIGINS }}
        run: |
          for v in AWS_ACCOUNT_ID MEDASSIST_EXEC_ROLE_ARN MEDASSIST_TASK_ROLE_ARN MEDASSIST_CORS_ORIGINS; do
            [ -n "${!v}" ] || { echo "::error::GitHub variable $v is not set"; exit 1; }
          done
          # Single quotes on purpose: envsubst gets the list of names and replaces only these.
          # shellcheck disable=SC2016
          envsubst '${AWS_ACCOUNT_ID} ${AWS_REGION} ${MEDASSIST_EXEC_ROLE_ARN} ${MEDASSIST_TASK_ROLE_ARN}' \
            < "$TASK_DEF_FILE" \
            | jq --arg cors "$MEDASSIST_CORS_ORIGINS" \
                '(.containerDefinitions[0].environment[] | select(.name == "CORS_ORIGINS") | .value) = $cors' \
            > task-definition.filled.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.filled.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}

      - name: Register task definition and deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # /ready checks the DB and config through the public URL (CloudFront -> ALB -> task).
      - name: Check /ready through the public URL
        env:
          PUBLIC_URL: ${{ vars.MEDASSIST_PUBLIC_URL }}
        run: |
          [ -n "$PUBLIC_URL" ] || { echo "::error::GitHub variable MEDASSIST_PUBLIC_URL is not set"; exit 1; }
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PUBLIC_URL%/}/ready" || true)
            echo "attempt $i: /ready -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/ready did not return 200; roll back: see medassist-api/docs/DEPLOY.md section 11"
          exit 1
