services:
  medassist-api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      # slim image has no curl
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:8000' + os.environ.get('API_PREFIX', '').rstrip('/') + '/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
