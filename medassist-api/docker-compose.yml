# Local use only: run the production image with the local .env (never baked into the image).
services:
  medassist-api:
    build:
      context: .
      args:
        # `$env:WITH_RERANK="true"; docker compose up --build` for an image with FlashRank
        WITH_RERANK: ${WITH_RERANK:-false}
    image: medassist-api:local
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      # same probe as the Dockerfile HEALTHCHECK (slim image has no curl)
      test: ["CMD", "python", "-c", "import os, urllib.request; p = os.environ.get('API_PREFIX', '').strip().strip('/'); urllib.request.urlopen('http://127.0.0.1:8000' + ('/' + p if p else '') + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
